services:
  postgres:
    image: postgres:16
    container_name: queueflow-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: queueflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: queueflow-redis
    restart: always
    ports:
      - "6379:6379"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: queueflow-zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: queueflow-kafka
    restart: always
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  job-service:
    build:
      context: .
      dockerfile: job-service/Dockerfile
    container_name: queueflow-job-service
    restart: always
    depends_on:
      - postgres
      - kafka
      - redis
    ports:
      - "8080:8080"
    env_file:
      - .env

  worker-service:
    build:
      context: .
      dockerfile: worker-service/Dockerfile
    container_name: queueflow-worker-service
    restart: always
    depends_on:
      - postgres
      - kafka
    ports:
      - "2112:2112"
    env_file:
      - .env

  scheduler-service:
    build:
      context: .
      dockerfile: scheduler-service/Dockerfile
    container_name: queueflow-scheduler-service
    depends_on:
      - postgres
      - kafka
    env_file:
      - .env

  prometheus:
    image: prom/prometheus
    container_name: queueflow-prometheus

    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana
    container_name: queueflow-grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./monitoring/dashboards:/etc/grafana/provisioning/dashboards/json
      - ./monitoring/provisioning/dashboards:/etc/grafana/provisioning/dashboards

  nginx:
    image: nginx:latest
    container_name: queueflow-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - job-service

volumes:
  postgres_data:
  grafana-storage:
