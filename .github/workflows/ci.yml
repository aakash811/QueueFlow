name: QueueFlow CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install Dependencies
        run: go mod tidy

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: "latest"

      - name: Run Tests
        run: go test ./...

      - name: Vulnerability Scan (Go)
        run: go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./...

      - name: Build Job Service
        run: |
          cd job-service
          go build -o main .

      - name: Build Worker Service
        run: |
          cd worker-service
          go build -o main .

      - name: Build Scheduler Service
        run: |
          cd scheduler-service
          go build -o main .

      - name: Docker Compose Build
        run: docker compose build

      - name: Vulnerability Scan (Container Images)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "queueflow-job-service:latest,queueflow-worker-service:latest,queueflow-scheduler-service:latest"
          format: "sarif"
          output: "trivy-results.sarif"
